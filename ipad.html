<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peek-A-Feel Wireframes</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
}

/* ---------- Buttons ---------- */
.button-style {
    position: fixed;
    top: 24px;
    padding: 12px 28px;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 28px;
    border: none;
    cursor: pointer;
    color: #fff;
    background: linear-gradient(90deg, #0071e3, #2997ff);
    box-shadow: 0 6px 24px rgba(0,0,0,0.12);
    transition: transform 0.2s ease, background 0.2s ease;
    z-index: 1000;
}

.button-style:hover {
    transform: translateY(-2px) scale(1.04);
    background: linear-gradient(90deg, #2997ff, #0071e3);
}

.back-btn { left: 24px; }
.topright-btn { right: 24px; }

/* ---------- Header ---------- */
.header-section {
    text-align: center;
    padding: 80px 20px 10px;
}

.header-inner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
}

.header-icon {
    width: 64px;
    height: 64px;
    border-radius: 16px;
}

.header-section h1 {
    font-size: 3rem;
    font-weight: 700;
    margin: 0;
}

/* ---------- Description ---------- */
.header-description {
    margin-top: 30px;
    font-size: 1.05rem;
    color: #6e6e73;
    max-width: 620px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.5;
}

/* ---------- Content Section ---------- */
.content-section {
    margin-top: -30px;
}

/* ---------- Carousel ---------- */
.stack-carousel {
    position: relative;
    width: 100%;
    max-width: 520px;
    height: 340px;
    margin: 0 auto;
}

.card {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.45s cubic-bezier(.4,2,.6,1), opacity 0.3s;
    pointer-events: none;
}

.device {
    max-width: 360px;
    max-height: 260px;
    border-radius: 18px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.15);
}

/* ---------- Caption ---------- */
.wireframe-caption {
    text-align: center;
    margin-top: 20px;
    font-size: 1.15rem;
    font-weight: 500;
}

/* ---------- Prototype Button ---------- */
.prototype-btn {
    display: block;
    margin: 40px auto 80px;
    padding: 16px 42px;
    font-size: 1.15rem;
    font-weight: 600;
    border-radius: 32px;
    border: none;
    cursor: pointer;
    color: #fff;
    background: linear-gradient(90deg, #0071e3, #2997ff);
    box-shadow: 0 6px 24px rgba(0,0,0,0.12);
    transition: transform 0.2s ease, background 0.2s ease;
}

.prototype-btn:hover {
    transform: translateY(-2px) scale(1.03);
    background: linear-gradient(90deg, #2997ff, #0071e3);
}
</style>
</head>

<body>

<!-- Buttons -->
<button class="button-style back-btn" onclick="window.location.href='index.html#previous-projects'">
    Home
</button>

<button class="button-style topright-btn" onclick="window.location.href='laptop.html'">
    DryFlow Magnetics
</button>

<!-- Header -->
<div class="header-section">
    <div class="header-inner">
        <img src="assets/AppIcon.png" class="header-icon">
        <h1>Peek-A-Feel</h1>
    </div>
    <p class="header-description">
        An app designed in Figma and coded in Swift during the Apple Foundation Program,
        helping 3–5 year olds identify, understand, and express their emotions.
    </p>
</div>

<!-- Content -->
<div class="content-section">

    <div class="stack-carousel" id="carousel">
        <div class="card"><img src="assets/Wireframe1_ipad.png" class="device"></div>
        <div class="card"><img src="assets/Wireframe2_ipad.png" class="device"></div>
        <div class="card"><img src="assets/Wireframe3_ipad.png" class="device"></div>
        <div class="card"><img src="assets/Wireframe4_ipad.png" class="device"></div>
        <div class="card"><img src="assets/Wireframe5_ipad.png" class="device"></div>
    </div>

    <div class="wireframe-caption" id="caption">Identify emotions</div>

    <button class="prototype-btn"
        onclick="window.open('https://www.youtube.com/watch?v=F8LFG2716Sc','_blank')">
        View Figma Prototype
    </button>

</div>

<script>
const cards = document.querySelectorAll(".card");
const caption = document.getElementById("caption");

const captions = [
    "Identify emotions",
    "Voice record why they felt that way",
    "Personalised AI positive reinforcement",
    "Mood tracker",
    "Analyses patterns & generates report"
];

let current = 0;
const total = cards.length;

function mod(n, m) {
    return ((n % m) + m) % m;
}

function updateCarousel() {
    cards.forEach((card, i) => {
        const offset = mod(i - current, total);
        let x = 0, scale = 1, opacity = 1, z = 5;

        if (offset === 1) {
            x = 220; scale = 0.88; opacity = 0.45; z = 4;
        } else if (offset === total - 1) {
            x = -220; scale = 0.88; opacity = 0.45; z = 4;
        } else if (offset !== 0) {
            opacity = 0; scale = 0.7; z = 1;
        }

        card.style.transform = `translateX(${x}px) scale(${scale})`;
        card.style.opacity = opacity;
        card.style.zIndex = z;
    });

    caption.textContent = captions[current];
}

updateCarousel();

setInterval(() => {
    current = mod(current + 1, total);
    updateCarousel();
}, 1000);
</script>

</body>
</html>
